name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MIN_EXPECTED_PYTHON_SOURCES: '30'
      PYTHONOPTIMIZE: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Create raw-output directory
        run: mkdir -p "$RUNNER_TEMP/p068-science"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute complete offline validation from the flat artifact root
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 4194304
          ulimit -t 1200
          ulimit -f 1048576
          timeout --signal=TERM --kill-after=10s 20m bash -euo pipefail -c '
            python -B .github/scripts/check_repository.py
            python -B validate.py --out "$RUNNER_TEMP/p068-science/results"
            python -B -c "import json, os, pathlib; p = pathlib.Path(os.environ[\"RUNNER_TEMP\"]) / \"p068-science/results/summary.json\"; s = json.loads(p.read_text()); assert s[\"all_checks_passed\"] is True; assert s[\"unique_unit_tests\"] >= 93; assert s[\"campaign_deterministic_equal\"] is True; assert s[\"epoch_scientific_equal\"] is True"
          ' 2>&1 | tee "$RUNNER_TEMP/p068-science/console.log"
      - name: Preserve raw outputs even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p068-scientific-output
          path: ${{ runner.temp }}/p068-science
          if-no-files-found: warn
          retention-days: 14
